# =============================================================================
# Banco XYZ — Stack completo (Exp3 Semana 8)
# Orden de arranque: postgres → kafka → keycloak → config-server →
#                    eureka-server → core-service → bff-*
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: bancoxyz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bancoxyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bancoxyz-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bancoxyz-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bancoxyz-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      # H2 en archivo (dev-mem se vaciaba en ejecucion: "Table CLIENT not found")
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/bancoxyz-realm.json:/opt/keycloak/data/import/bancoxyz-realm.json
    healthcheck:
      # La imagen de Keycloak no trae curl: se usa /dev/tcp de bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && printf 'GET /realms/bancoxyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - bancoxyz-net

  # ---------------------------------------------------------------------------
  # Spring Cloud — Infraestructura de microservicios
  # ---------------------------------------------------------------------------
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bancoxyz-net

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bancoxyz-net

  # ---------------------------------------------------------------------------
  # Microservicios de negocio
  # ---------------------------------------------------------------------------
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - bancoxyz-net

  bff-web:
    build:
      context: ./bff-web
      dockerfile: Dockerfile
    container_name: bff-web
    ports:
      - "8081:8081"
    depends_on:
      core-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - bancoxyz-net

  bff-mobile:
    build:
      context: ./bff-mobile
      dockerfile: Dockerfile
    container_name: bff-mobile
    ports:
      - "8082:8082"
    depends_on:
      core-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - bancoxyz-net

  bff-cajero:
    build:
      context: ./bff-cajero
      dockerfile: Dockerfile
    container_name: bff-cajero
    ports:
      - "8083:8083"
    depends_on:
      core-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - bancoxyz-net

volumes:
  postgres_data:

networks:
  bancoxyz-net:
    driver: bridge
